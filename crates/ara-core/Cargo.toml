[package]
name = "ara-core"
description = "Shared parsing, normalization, and DAG layout for the ARA viewer runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# `cargo publish` bundles `tests/` by default. Excluding all fixtures keeps
# third-party corpus data out of the MPL-2.0 crate tarball — the CC-BY-4.0
# `corpus/` subset (attribution-required) and the MIT `official/` set. Tests
# still run from a git checkout / workspace, just not from the published crate.
exclude = ["tests/fixtures/**"]

[dependencies]
dagre-dgl-rs = "=0.1.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
yaml-rust2 = { version = "=0.10.4", optional = true }
base64 = { version = "=0.22.1", optional = true }
serde_path_to_error = { version = "0.1", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
serde_json = "1"
tempfile = "3"

[features]
default = ["native"]
# Gates filesystem, guarded source writes, and durable merge operations.
# `parse_sources`/normalization remain wasm-safe without this feature.
native = ["dep:serde_json", "dep:sha2", "dep:yaml-rust2", "dep:serde_path_to_error", "dep:base64"]
